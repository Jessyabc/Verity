# Deploy the Afaqi chat Edge Function when it changes on main.
# Requires repo secrets:
#   SUPABASE_ACCESS_TOKEN  — from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — project ref (subdomain of *.supabase.co), OR SUPABASE_URL
#
# Also runnable manually: Actions → Deploy afaqi-chat → Run workflow

name: Deploy afaqi-chat

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/afaqi-chat/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-afaqi-chat.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy afaqi-chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve project ref
        id: ref
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "project_ref=$SUPABASE_PROJECT_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$SUPABASE_URL" ]; then
            ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
            echo "project_ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set SUPABASE_PROJECT_REF or SUPABASE_URL repo secret."
            exit 1
          fi

      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."
            exit 1
          fi
          supabase functions deploy afaqi-chat \
            --project-ref "${{ steps.ref.outputs.project_ref }}"
